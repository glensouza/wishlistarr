name: Release

permissions:
  contents: read

on:
  push:
    tags: ["v*"]

env:
  IMAGE: ghcr.io/glensouza/wishlistarr

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require tag on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit is not on main" >&2
            exit 1
          fi
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Generate third-party license notices
        run: |
          dotnet build src/Wishlistarr.Api/Wishlistarr.Api.csproj -c Release
          npm ci --prefix web
          npm run build --prefix web
          cp web/public/licenses/npm.json npm-licenses.json
          cp web/public/licenses/nuget.json nuget-licenses.json
      - uses: actions/upload-artifact@v7
        with:
          name: third-party-licenses
          path: |
            npm-licenses.json
            nuget-licenses.json
          if-no-files-found: error
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if ! echo "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "Tag $tag is not a SemVer version" >&2
            exit 1
          fi
          tags="${IMAGE}:${version}"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            major="${version%%.*}"
            minor="${version#*.}"
            minor="${major}.${minor%%.*}"
            tags="${tags},${IMAGE}:${minor},${IMAGE}:${major},${IMAGE}:latest"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            flags="--prerelease"
          else
            flags="--latest"
          fi
          gh release create "$GITHUB_REF_NAME" npm-licenses.json nuget-licenses.json --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $flags
