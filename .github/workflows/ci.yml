name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - docs/**
      - site/**
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/pages.yml
      - .github/workflows/release.yml
      - .github/FUNDING.yml
      - .github/CODEOWNERS
      - LICENSE
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release
      - run: dotnet publish src/Wishlistarr.Api/Wishlistarr.Api.csproj --no-build --configuration Release --output publish
      - run: test -s publish/wwwroot/licenses/nuget.json
      - uses: actions/upload-artifact@v7
        with:
          name: nuget-licenses
          path: publish/wwwroot/licenses/nuget.json
          if-no-files-found: error

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: npm-licenses
          path: web/public/licenses/npm.json
          if-no-files-found: error
      - run: npm test

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker build --tag wishlistarr:ci .
